spring:
  datasource:
    username: root
    password: root12345
    url: jdbc:mysql://localhost:3306/mydb?allowLoadLocalInfile=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    init:
      mode: always

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  config:
    use-legacy-processing: true
  h2:
    console:
      enabled: true
  sql:
    init:
      mode: always

server:
  port: 8080
  include-debug-info: true
  error:
    include-message: always


